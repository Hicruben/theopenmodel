name: Daily build & deploy

# 03:30 UTC: after the last European kickoffs finish, before the next matchday.
# The build locks pre-kickoff probabilities into the daily snapshot and scores
# finished results — committing them back is what makes the record verifiable:
# the git timestamp proves each prediction existed before the match.
on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency: deploy

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Deliberately allowed to fail the whole run. The schedule decides kickoff times,
      # match slugs and which predictions count as pre-kickoff, so shipping a bad one is
      # worse than not shipping: Cloudflare keeps serving the last good deploy while a
      # failure here sends a notification. A silent skip is what let placeholder kickoff
      # times reach the site for weeks.
      - name: Refresh season schedule
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: node scripts/fetch-fixtures.mjs

      - name: Build (fetch data, lock snapshot, static export)
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          # Public by design — it only identifies which Kit form a submission belongs to.
          # Unset means the signup form renders nowhere rather than collecting into a void.
          NEXT_PUBLIC_KIT_FORM_ID: ${{ vars.KIT_FORM_ID }}
        run: npm run build

      # Runs after the build has refreshed everything, and fails the job if any input has
      # quietly stopped updating. Three datasets went stale for weeks without anyone
      # noticing, because a stale forecast is indistinguishable from a fresh one on the
      # page — the only way to see it is to assert on the data.
      - name: Check data freshness
        run: node scripts/check-data-freshness.mjs

      - name: Commit snapshot + data back to the public record
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ public/data/
          git diff --cached --quiet || git commit -m "record: daily snapshot & results $(date -u +%F)"
          git push

      - name: Deploy static export to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy

      - name: Verify site is up
        run: |
          for path in / /record/ /data/season-forecast.csv; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://theopenmodel.com$path")
            echo "$path -> $code"; [ "$code" = "200" ] || exit 1
          done

      # Runs only once the new pages are actually live, so the engines fetch today's
      # numbers rather than yesterday's.
      - name: Submit URLs to IndexNow (Bing/Yandex)
        run: node scripts/indexnow-ping.mjs

      # Posting stays off until TELEGRAM_ENABLED is set to "1" in repo variables, even
      # if the token is present — broadcasting to subscribers should be a deliberate
      # switch, not a side effect of adding a secret. Without credentials the script
      # prints the posts and sends nothing.
      - name: Post matchday preview & scorecard to Telegram
        if: vars.TELEGRAM_ENABLED == '1'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
        run: |
          npx tsx scripts/telegram-post.ts scorecard
          npx tsx scripts/telegram-post.ts preview

      # The dedup locks the posting script writes are only meaningful if they survive
      # the runner, so they get their own commit after the posts have gone out.
      - name: Commit posting state
        if: vars.TELEGRAM_ENABLED == '1'
        run: |
          git add data/state/ 2>/dev/null || true
          git diff --cached --quiet || {
            git commit -m "telegram: posting state $(date -u +%F)"
            git push
          }
